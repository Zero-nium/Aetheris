<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetheris</title>
  <script src="/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f5; color: #1a1a2e; line-height: 1.5; overflow: hidden; }
    a { color: #ff6b9d; }

    /* Top bar */
    #topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; background: #fff; border-bottom: 1px solid #eee; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    #topbar .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    #topbar .logo .icon { font-size: 24px; }
    #topbar .controls { display: flex; gap: 8px; align-items: center; }
    #topbar button, .nav-btn { padding: 8px 16px; background: #fff; border: 1px solid #ddd; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; color: #555; transition: all 0.15s; }
    #topbar button:hover, .nav-btn:hover { background: #fafafa; border-color: #ccc; }
    #topbar .running { background: #ff6b9d; border-color: #ff6b9d; color: #fff; }
    .nav-btn.active { background: #fff0f5; border-color: #ff6b9d; color: #ff6b9d; }
    .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff6b9d; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    /* Main layout */
    #main { display: flex; flex: 1; height: calc(100vh - 52px); }
    .view { display: none; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* === WORLD VIEW === */
    #world-view { flex: 1; }

    /* Map panel */
    #map { width: 420px; border-right: 1px solid #eee; background: #fff; position: relative; flex-shrink: 0; }
    #map svg { width: 100%; height: calc(100% - 220px); }
    .space-node { fill: #f0f0f5; stroke: #ddd; stroke-width: 2; }
    .space-node:hover { stroke: #ff6b9d; }
    .space-label { fill: #555; font-size: 10px; text-anchor: middle; pointer-events: none; font-weight: 600; }
    .link { stroke: #eee; stroke-width: 2; }
    .agent-dot { fill: #ff6b9d; stroke: #fff; stroke-width: 1.5; }
    .agent-label { fill: #ff6b9d; font-size: 8px; text-anchor: middle; pointer-events: none; }

    /* Resonance bar */
    #resonance-bar { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; padding: 12px 14px; max-height: 220px; overflow-y: auto; }
    .res-item { margin-bottom: 6px; }
    .res-label { font-size: 11px; color: #888; display: flex; justify-content: space-between; }
    .res-track { height: 4px; background: #f0f0f5; border-radius: 2px; overflow: hidden; margin-top: 3px; }
    .res-fill { height: 100%; transition: width 0.3s; border-radius: 2px; }

    /* Event feed column */
    #event-feed { width: 360px; border-right: 1px solid #eee; background: #fff; overflow-y: auto; flex-shrink: 0; }
    .section-title { font-size: 22px; font-weight: 800; padding: 20px 20px 16px; border-left: 4px solid #ff6b9d; margin: 0 0 12px 16px; line-height: 1.2; }
    .feed-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; transition: background 0.15s; }
    .feed-item:hover { background: #fafafa; }
    .feed-item .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; background: #f0f0f5; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #888; position: relative; }
    .feed-item .avatar .online-dot { position: absolute; bottom: 1px; right: 1px; width: 9px; height: 9px; background: #ff6b9d; border-radius: 50%; border: 2px solid #fff; }
    .feed-item .content { flex: 1; font-size: 13px; line-height: 1.4; }
    .feed-item .agent-name { color: #1a1a2e; font-weight: 600; }
    .feed-item .action-text { color: #888; }
    .feed-item .time { font-size: 12px; color: #bbb; flex-shrink: 0; }
    .feed-item.interaction { background: #fff0f5; border-left: 3px solid #ff6b9d; }
    .feed-item.interaction:hover { background: #ffe0ee; }
    .feed-item.interaction em { color: #c44d7a; font-style: italic; }

    /* World feed column */
    #world-feed { flex: 1; overflow-y: auto; padding: 24px; background: #fff; }
    .world-feed-header { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #1a1a2e; }
    .world-feed-header .globe { font-size: 22px; }
    .feed-card { border: 1px solid #eee; border-radius: 14px; overflow: hidden; margin-bottom: 20px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .feed-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .feed-card .card-body { padding: 16px 20px; }
    .feed-card .card-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .feed-card .card-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; color: #1a1a2e; }
    .feed-card .card-desc { font-size: 14px; color: #888; line-height: 1.4; }
    .feed-card .card-time { font-size: 12px; color: #bbb; margin-top: 8px; }
    .feed-card .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .feed-card .card-avatars { display: flex; }
    .feed-card .card-avatars .mini-avatar { width: 28px; height: 28px; border-radius: 50%; background: #f0f0f5; border: 2px solid #fff; margin-left: -6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .feed-card .card-avatars .mini-avatar:first-child { margin-left: 0; }
    .feed-card .card-meta { font-size: 12px; color: #aaa; }
    .feed-card .card-meta .reactions { color: #ff6b9d; font-weight: 600; }
    .tag-world_event { color: #e8a830; }
    .tag-world_expansion { color: #56d364; }
    .tag-agent_interaction { color: #ff6b9d; }
    .text-event { padding: 12px 16px; margin-bottom: 8px; background: #fafafa; border-radius: 10px; border: 1px solid #f0f0f0; }
    .text-event .type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #bbb; font-weight: 600; }
    .text-event .content { font-size: 14px; color: #555; margin-top: 2px; }
    .text-event .time { font-size: 11px; color: #ccc; margin-top: 4px; }
    .conv-turn { padding: 4px 0; font-size: 13px; line-height: 1.4; color: #555; }
    .conv-speaker { font-weight: 600; color: #1a1a2e; }
    .tag-conversation { color: #ff6b9d; }
    .conv-tile { cursor: pointer; transition: background 0.15s; }
    .conv-tile:hover { background: #fff0f5; }
    .conv-label { font-size: 11px; font-weight: 600; color: #ff6b9d; text-transform: uppercase; letter-spacing: 0.5px; }
    .conv-expanded { padding: 8px 12px 12px 48px; border-bottom: 1px solid #f5f5f5; background: #fafafa; }

    /* === CHAT VIEW === */
    #chat-view { flex: 1; }
    #chat-sidebar { width: 220px; border-right: 1px solid #eee; background: #fff; overflow-y: auto; }
    #chat-sidebar h3 { font-size: 18px; font-weight: 700; padding: 20px 16px 12px; }
    .friend-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; border-radius: 12px; margin: 0 8px 4px; transition: background 0.15s; }
    .friend-item:hover { background: #fafafa; }
    .friend-item.active { background: #fff0f5; }
    .friend-item .avatar { width: 42px; height: 42px; border-radius: 50%; background: #f0f0f5; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: #888; }
    .friend-item.active .avatar { border: 2px solid #ff6b9d; }
    .friend-item .name { font-size: 15px; font-weight: 500; color: #1a1a2e; }
    .friend-item .status { font-size: 12px; color: #aaa; }

    #chat-profile { width: 240px; border-right: 1px solid #eee; background: #fff; display: flex; flex-direction: column; align-items: center; padding: 32px 20px; }
    #chat-profile .big-avatar { width: 140px; height: 140px; border-radius: 50%; background: #f5f0eb; border: 3px solid #ffd6e0; display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 16px; }
    #chat-profile .name { font-size: 26px; font-weight: 700; color: #1a1a2e; }
    #chat-profile .status { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #888; margin-top: 4px; }
    #chat-profile .info { font-size: 13px; color: #aaa; margin-top: 12px; text-align: center; }

    #chat-main { flex: 1; display: flex; flex-direction: column; background: #fff; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 24px; }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; max-width: 75%; }
    .msg .avatar { width: 38px; height: 38px; border-radius: 50%; background: #f0f0f5; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .msg .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
    .msg .bubble .sender { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.user .bubble { background: #ffe4ee; border-top-right-radius: 4px; }
    .msg.user .bubble .sender { color: #c44d7a; }
    .msg.agent .bubble { background: #f4f4f8; border-top-left-radius: 4px; }
    .msg.agent .bubble .sender { color: #1a1a2e; }
    #chat-input { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid #f0f0f0; }
    #chat-input input { flex: 1; padding: 14px 18px; border: 1px solid #e0e0e0; border-radius: 26px; font-family: inherit; font-size: 14px; outline: none; background: #fafafa; color: #1a1a2e; }
    #chat-input input:focus { border-color: #ff6b9d; }
    #chat-input button { padding: 14px 26px; background: #ff6b9d; border: none; border-radius: 26px; color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
    #chat-input button:hover { background: #e85a8a; }

    /* === MOBILE === */
    @media (max-width: 768px) {
      #main { flex-direction: column; }
      #map { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid #eee; }
      #map svg { height: calc(100% - 80px); }
      #resonance-bar { max-height: 70px; }
      #event-feed { width: 100%; border-right: none; border-bottom: 1px solid #eee; max-height: 250px; }
      .section-title { font-size: 18px; padding: 12px 16px 8px; }
      #world-feed { padding: 16px; }
      #chat-sidebar { width: 100%; border-right: none; border-bottom: 1px solid #eee; max-height: 120px; }
      #chat-sidebar h3 { padding: 12px 16px 6px; }
      #friend-list { display: flex; gap: 8px; padding: 0 12px 8px; overflow-x: auto; }
      .friend-item { flex-shrink: 0; margin: 0; }
      #chat-profile { display: none; }
      #chat-main { flex: 1; }
      .feed-card img { height: 140px; }
    }
    @media (max-width: 480px) {
      #topbar { padding: 8px 12px; }
      #topbar .logo { font-size: 16px; }
      #topbar .logo .icon { font-size: 18px; }
      #topbar button, .nav-btn { padding: 6px 10px; font-size: 12px; }
      #map { height: 160px; }
      #event-feed { max-height: 200px; }
      .feed-item { padding: 10px 12px; }
      .feed-item .avatar { width: 32px; height: 32px; font-size: 14px; }
      .feed-item .content { font-size: 12px; }
      .feed-card img { height: 120px; }
      .feed-card .card-title { font-size: 16px; }
      #chat-messages { padding: 16px; }
      .msg .bubble { font-size: 13px; }
      #chat-input { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="logo"><span class="icon">📍🗺️</span> Aetheris</div>
    <div class="controls">
      <button class="nav-btn active" id="nav-world" onclick="switchView('world')">🌍 World</button>
      <button class="nav-btn" id="nav-chat" onclick="switchView('chat')">💬 Chat</button>
      <button id="run-btn" onclick="toggleRun()">▶ Start</button>
      <button onclick="runTicks(1)">Step</button>
    </div>
  </div>
  <div id="main">
    <div class="view active" id="world-view">
      <div id="map">
        <div id="map-bg" style="position:absolute;top:0;left:0;right:0;bottom:120px;background-size:cover;background-position:center;opacity:0.15;z-index:0;"></div>
        <svg id="graph" style="position:relative;z-index:1;"></svg>
        <div id="resonance-bar" style="position:relative;z-index:1;"></div>
      </div>
      <div id="event-feed">
        <div class="section-title">Event Feed</div>
        <div id="event-list"></div>
      </div>
      <div id="world-feed">
        <div class="world-feed-header"><span class="globe">🌐</span> World Feed</div>
        <div id="world-cards"></div>
      </div>
    </div>
    <div class="view" id="chat-view">
      <div id="chat-sidebar">
        <h3>Friends</h3>
        <div id="friend-list"></div>
      </div>
      <div id="chat-profile">
        <div class="big-avatar" id="profile-avatar">🐱</div>
        <div class="name" id="profile-name">Poly</div>
        <div class="status"><span class="live-dot"></span> online</div>
        <div class="info" id="profile-info">Librarian · Zen</div>
      </div>
      <div id="chat-main">
        <div id="chat-messages"></div>
        <div id="chat-input">
          <input type="text" id="chat-text" placeholder="Message Poly..." onkeypress="if(event.key==='Enter')sendMessage()" />
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    let running = false, runInterval = null;
    let simulation = null, svg = null, g = null;
    let linkG, nodeG, agentG, labelG;
    let activeAgent = null;

    function switchView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (view === 'world') { document.getElementById('world-view').classList.add('active'); document.getElementById('nav-world').classList.add('active'); }
      if (view === 'chat') { document.getElementById('chat-view').classList.add('active'); document.getElementById('nav-chat').classList.add('active'); loadFriendList(); }
    }

    function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function toggleConv(id) { const el = document.getElementById('conv-' + id); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; }

    function initGraph() {
      const mapEl = document.getElementById('map');
      const w = mapEl.clientWidth, h = mapEl.clientHeight - 120;
      svg = d3.select('#graph').attr('viewBox', `0 0 ${w} ${h}`);
      g = svg.append('g');
      linkG = g.append('g'); nodeG = g.append('g'); agentG = g.append('g'); labelG = g.append('g');
      simulation = d3.forceSimulation()
        .force('link', d3.forceLink().id(d => d.id).distance(100).strength(0.1))
        .force('charge', d3.forceManyBody().strength(-350))
        .force('center', d3.forceCenter(w/2, h/2))
        .force('collision', d3.forceCollide().radius(40));
      simulation.on('tick', () => {
        linkG.selectAll('line').attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        nodeG.selectAll('circle').attr('cx',d=>d.x).attr('cy',d=>d.y);
        agentG.selectAll('circle').attr('cx',d=>d.x).attr('cy',d=>d.y);
        labelG.selectAll('text').attr('x',d=>d.x).attr('y',d=>d.y-22);
      });
      svg.call(d3.zoom().scaleExtent([0.3,3]).on('zoom', e => g.attr('transform', e.transform)));
    }

    function updateGraph(data) {
      const nodes = data.spaces.map(s => ({id:s.id, name:s.name, image_url:s.image_url}));
      const links = [];
      data.spaces.forEach(s => { s.connections.forEach(c => { if(nodes.find(n=>n.id===c)) links.push({source:s.id, target:c}); }); });
      const agents = data.agents.map(a => {
        const n = nodes.find(n => n.id === a.space_id);
        return {id:a.id, name:a.name, x:n?.x||0, y:n?.y||0};
      });
      linkG.selectAll('line').data(links).join('line').attr('class','link');
      const nodeSel = nodeG.selectAll('circle').data(nodes).join(enter=>enter.append('circle').attr('class','space-node').attr('r',16));
      nodeSel.on('click', (event, d) => { event.stopPropagation(); selectSpace(d.id, d.name, d.image_url); });
      labelG.selectAll('text').data(nodes).join(enter=>enter.append('text').attr('class','space-label').text(d=>d.name), update=>update.text(d=>d.name));
      agentG.selectAll('circle').data(agents).join(enter=>enter.append('circle').attr('class','agent-dot').attr('r',4));
      simulation.nodes(nodes);
      simulation.force('link').links(links);
      simulation.alpha(0.3).restart();
    }

    let selectedSpaceEl = null;
    function selectSpace(id, name, imageUrl) {
      const mapBg = document.getElementById('map-bg');
      if (imageUrl) {
        mapBg.style.backgroundImage = `url(${imageUrl})`;
      }
      d3.selectAll('.space-node').style('stroke', function(d) { return d.id === id ? '#ff6b9d' : ''; });
    }

    let avatarMap = {}; // name → avatar_url
    async function loadAvatarMap() {
      try {
        const d = await (await fetch('/api/agents')).json();
        avatarMap = {};
        for (const a of d.agents) { if (a.avatar_url) avatarMap[a.name] = a.avatar_url; }
      } catch(e) {}
    }
    function getAvatar(name) {
      if (!name) return '?';
      const url = avatarMap[name];
      if (url) return `<img src="${url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" alt="${escapeHtml(name)}" />`;
      return name.charAt(0).toUpperCase();
    }

    function updateEventFeed(events) {
      // Event Feed: agent actions, moves, minor interactions, conversations (collapsed)
      // Exclude anything that goes to World Feed (world_expansion, world_event, significant conversations)
      const worldEventTicks = new Set();
      for (const e of events) {
        if (e.type === 'world_expansion' || e.type === 'world_event') {
          for (let t = (e.tick||0) - 5; t <= (e.tick||0) + 5; t++) worldEventTicks.add(t);
        }
      }
      const agentEvents = events.filter(e => {
        if (e.type === 'agent_action' || e.type === 'agent_move') return true;
        if (e.type === 'agent_interaction' || e.type === 'agent_conversation') return true;
        return false;
      }).slice(-50);
      const html = agentEvents.reverse().map(e => {
        const name = e.agent_name || '?';
        const ts = e.timestamp || e.created_at;
        const time = ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        const avatar = getAvatar(name);
        // Conversation — collapsible
        if (e.type === 'agent_conversation' || e.type === 'agent_interaction') {
          let names = [];
          if (e.participants && e.participants.length > 0) names = e.participants.map(p => p.name);
          else if (e.agent_name && e.target_name) names = [e.agent_name, e.target_name];
          else if (e.agent_name) names = [e.agent_name];
          if (names.length === 0 && e.content) {
            const m = e.content.match(/^(.+?) (?:started|→)/);
            if (m) names = m[1].split(', ');
          }
          if (names.length === 0) names = ['?'];
          // If dialogue is multi-turn JSON, extract all unique speakers
          if (e.dialogue) {
            try {
              const parsed = JSON.parse(e.dialogue);
              if (Array.isArray(parsed)) {
                const speakers = [...new Set(parsed.map(t => t.speaker).filter(Boolean))];
                if (speakers.length > names.length) names = speakers;
              }
            } catch {}
          }
          const isSignificant = worldEventTicks.has(e.tick) || (e.significance === 'major' || e.significance === 'moderate');
          if (isSignificant) return ''; // Skip — goes to World Feed
          let turns = '';
          if (e.dialogue) {
            // Check if dialogue is a JSON array (multi-turn) or plain text
            try {
              const parsed = JSON.parse(e.dialogue);
              if (Array.isArray(parsed)) {
                turns = parsed.map(t => `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(t.speaker || '?')}:</span> ${escapeHtml(t.text || '')}</div>`).join('');
              } else {
                turns = `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(names[0] || '?')}:</span> ${escapeHtml(String(e.dialogue))}</div>`;
              }
            } catch {
              turns = `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(names[0] || '?')}:</span> ${escapeHtml(e.dialogue)}</div>`;
              if (e.response) turns += `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(names[1] || '?')}:</span> ${escapeHtml(e.response)}</div>`;
            }
          }
          const convId = (e.conversation_id || e.id || Date.now()).toString().replace(/[^a-zA-Z0-9]/g,'');
          return `<div class="feed-item conv-tile" onclick="toggleConv('${convId}')"><div class="avatar">${avatar}</div><div class="content"><span class="conv-label">💬 Conversation</span> <span class="agent-name">${escapeHtml(names.join(', '))}</span></div><div class="time">${time}</div></div><div id="conv-${convId}" class="conv-expanded" style="display:none">${turns}</div>`;
        }
        const content = (e.content || '').replace(name + ' ', '');
        return `<div class="feed-item"><div class="avatar">${avatar}</div><div class="content"><span class="agent-name">${escapeHtml(name)}</span> <span class="action-text">${escapeHtml(content)}</span></div><div class="time">${time}</div></div>`;
      }).join('');
      document.getElementById('event-list').innerHTML = html;
    }

    function updateWorldFeed(events) {
      // World Feed: only significant events — world expansions, world events, 
      // conversations/interactions tied to world state changes
      const worldEventTicks = new Set();
      for (const e of events) {
        if (e.type === 'world_expansion' || e.type === 'world_event') {
          for (let t = (e.tick||0) - 5; t <= (e.tick||0) + 5; t++) worldEventTicks.add(t);
        }
      }
      const significant = events.filter(e => {
        if (e.type === 'world_expansion' || e.type === 'world_event') return true;
        if (e.type === 'agent_conversation' || e.type === 'agent_interaction') {
          return worldEventTicks.has(e.tick) || e.significance === 'major' || e.significance === 'moderate';
        }
        return false;
      });
      const items = significant.slice(-30).reverse();
      const html = items.map(e => {
        const ts = e.timestamp || e.created_at;
        const time = ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        // Conversation tied to world event
        if (e.type === 'agent_conversation' || e.type === 'agent_interaction') {
          let names = [];
          if (e.participants && e.participants.length > 0) names = e.participants.map(p => p.name);
          else if (e.agent_name && e.target_name) names = [e.agent_name, e.target_name];
          else if (e.agent_name) names = [e.agent_name];
          if (names.length === 0 && e.content) { const m = e.content.match(/^(.+?) (?:started|→)/); if (m) names = m[1].split(', '); }
          if (names.length === 0) names = ['?'];
          // If dialogue is multi-turn JSON, extract all unique speakers
          if (e.dialogue) {
            try {
              const parsed = JSON.parse(e.dialogue);
              if (Array.isArray(parsed)) {
                const speakers = [...new Set(parsed.map(t => t.speaker).filter(Boolean))];
                if (speakers.length > names.length) names = speakers;
              }
            } catch {}
          }
          const titleStr = names.join(', ');
          const avatars = names.map(n => `<div class="mini-avatar">${getAvatar(n)}</div>`).join('');
          let turns = '';
          if (e.dialogue) {
            try {
              const parsed = JSON.parse(e.dialogue);
              if (Array.isArray(parsed)) {
                turns = parsed.map(t => `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(t.speaker || '?')}:</span> ${escapeHtml(t.text || '')}</div>`).join('');
              } else {
                turns = `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(names[0] || '?')}:</span> ${escapeHtml(String(e.dialogue))}</div>`;
              }
            } catch {
              turns = `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(names[0] || '?')}:</span> ${escapeHtml(e.dialogue)}</div>`;
              if (e.response) turns += `<div class="conv-turn"><span class="conv-speaker">${escapeHtml(names[1] || '?')}:</span> ${escapeHtml(e.response)}</div>`;
            }
          } else {
            turns = `<div class="conv-turn" style="color:#bbb;font-style:italic">Conversation pending...</div>`;
          }
          const depthLabel = e.depth ? `${e.depth} turns` : '';
          const endingLabel = e.ending_style ? `· ${e.ending_style.replace(/_/g,' ')}` : '';
          return `<div class="feed-card type-conversation"><div class="card-body"><div class="card-tag tag-conversation">Conversation</div><div class="card-title">${escapeHtml(titleStr)}</div><div class="card-desc">${turns}</div><div class="card-footer"><div class="card-avatars">${avatars}</div><div class="card-time">${depthLabel} ${endingLabel} ${time}</div></div></div></div>`;
        }
        // World expansion with image
        if (e.image_prompt) {
          const id = btoa(e.image_prompt).slice(0,16).replace(/[^a-zA-Z0-9]/g,'');
          return `<div class="feed-card"><div class="card-body"><div class="card-tag tag-${e.type}">${escapeHtml(e.type.replace(/_/g,' '))}</div><div class="card-title">${escapeHtml(e.content||'')}</div><div class="card-time">${time}</div><div id="wimg-${id}" class="card-time" style="padding:16px;color:#bbb">Generating image...</div></div></div>`;
        }
        return `<div class="text-event"><div class="type">${escapeHtml(e.type.replace(/_/g,' '))}</div><div class="content">${escapeHtml(e.content||'')}</div><div class="time">${time}</div></div>`;
      }).join('');
      document.getElementById('world-cards').innerHTML = html;
      items.forEach(e => {
        if (e.image_prompt) {
          const id = btoa(e.image_prompt).slice(0,16).replace(/[^a-zA-Z0-9]/g,'');
          generateImage(id, e.image_prompt);
        }
      });
    }

    async function generateImage(id, prompt) {
      const el = document.getElementById('wimg-' + id);
      if (!el) return;
      try {
        const res = await fetch('/api/generate-image', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt})});
        const data = await res.json();
        if (data.url) el.outerHTML = `<img src="${data.url}" alt="Event" />`;
        else el.textContent = data.message || 'Image unavailable';
      } catch(e) { el.textContent = 'Image failed'; }
    }

    function updateResonance(resonance) {
      const colors = {exploration:'#ff6b9d',tending:'#56d364',knowledge:'#e8a830',social:'#9b7bff',mystery:'#ff9b6b'};
      const html = Object.entries(resonance).map(([k,r]) => {
        const pct = Math.round(parseFloat(r.value)/r.threshold*100);
        return `<div class="res-item"><div class="res-label"><span>${k}</span><span>${r.value}/${r.threshold}</span></div><div class="res-track"><div class="res-fill" style="width:${pct}%;background:${colors[k]||'#ff6b9d'}"></div></div></div>`;
      }).join('');
      document.getElementById('resonance-bar').innerHTML = html;
    }

    function loadFriendList() {
      fetch('/api/agents').then(r=>r.json()).then(d => {
        avatarMap = {};
        for (const a of d.agents) { if (a.avatar_url) avatarMap[a.name] = a.avatar_url; }
        const html = d.agents.map((a,i) => {
          const avatar = getAvatar(a.name);
          return `<div class="friend-item ${i===0?'active':''}" onclick="selectAgent('${a.id}')"><div class="avatar">${avatar}</div><div><div class="name">${escapeHtml(a.name)}</div><div class="status">online</div></div></div>`;
        }).join('');
        document.getElementById('friend-list').innerHTML = html;
        if (d.agents[0]) selectAgent(d.agents[0].id);
      });
    }

    let chatSessionId = null;
    function selectAgent(id) {
      fetch('/api/agents/'+id).then(r=>r.json()).then(d => {
        const a = d.agent; activeAgent = a;
        const avatar = getAvatar(a.name);
        document.getElementById('profile-avatar').innerHTML = avatar;
        document.getElementById('profile-name').textContent = a.name;
        document.getElementById('profile-info').textContent = `${a.job} · ${a.personality}`;
        document.getElementById('chat-text').placeholder = `Message ${a.name}...`;
        // Load message history
        const uid = localStorage.getItem('aetheris_uid') || generateUserId();
        fetch(`/api/agents/${id}/messages?user_id=${uid}&limit=20`).then(r=>r.json()).then(msgData => {
          const msgs = msgData.messages || [];
          if (msgs.length > 0) {
            const html = msgs.map(m => {
              if (m.role === 'user') {
                return `<div class="msg user"><div class="avatar">You</div><div class="bubble"><div class="sender">You</div>${escapeHtml(m.content)}</div></div>`;
              }
              return `<div class="msg agent"><div class="avatar">${avatar}</div><div class="bubble"><div class="sender">${escapeHtml(a.name)}</div>${escapeHtml(m.content)}</div></div>`;
            }).join('');
            document.getElementById('chat-messages').innerHTML = html;
          } else {
            document.getElementById('chat-messages').innerHTML = `<div class="msg agent"><div class="avatar">${avatar}</div><div class="bubble"><div class="sender">${escapeHtml(a.name)}</div>Hi! I'm ${escapeHtml(a.name)}. I'm a ${escapeHtml(a.job)} in the ${escapeHtml(a.state.space_id.replace(/_/g,' '))}. What would you like to know?</div></div>`;
          }
          const chatEl = document.getElementById('chat-messages');
          chatEl.scrollTop = chatEl.scrollHeight;
        }).catch(() => {
          document.getElementById('chat-messages').innerHTML = `<div class="msg agent"><div class="avatar">${avatar}</div><div class="bubble"><div class="sender">${escapeHtml(a.name)}</div>Hi! I'm ${escapeHtml(a.name)}. What would you like to know?</div></div>`;
        });
      });
    }

    function generateUserId() {
      let uid = localStorage.getItem('aetheris_uid');
      if (!uid) {
        uid = 'user-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('aetheris_uid', uid);
      }
      return uid;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-text');
      const text = input.value.trim();
      if (!text || !activeAgent) return;
      const msgs = document.getElementById('chat-messages');
      const avatar = getAvatar(activeAgent.name);
      const uid = generateUserId();
      if (!chatSessionId) chatSessionId = 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

      // Show user message
      msgs.innerHTML += `<div class="msg user"><div class="avatar">You</div><div class="bubble"><div class="sender">You</div>${escapeHtml(text)}</div></div>`;
      input.value = '';
      msgs.innerHTML += `<div class="msg agent" id="thinking-bubble" style="opacity:0.5"><div class="avatar">${avatar}</div><div class="bubble"><div class="sender">${escapeHtml(activeAgent.name)}</div><i>thinking...</i></div></div>`;
      msgs.scrollTop = msgs.scrollHeight;

      try {
        const res = await fetch(`/api/agents/${activeAgent.id}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, user_id: uid, session_id: chatSessionId }),
        });
        const data = await res.json();
        const thinking = document.getElementById('thinking-bubble');
        if (thinking) thinking.remove();
        if (data.response) {
          msgs.innerHTML += `<div class="msg agent"><div class="avatar">${avatar}</div><div class="bubble"><div class="sender">${escapeHtml(activeAgent.name)}</div>${escapeHtml(data.response)}</div></div>`;
        } else if (data.error) {
          msgs.innerHTML += `<div class="msg agent"><div class="avatar">${avatar}</div><div class="bubble"><div class="sender">${escapeHtml(activeAgent.name)}</div><i>${escapeHtml(data.error)}</i></div></div>`;
        }
        msgs.scrollTop = msgs.scrollHeight;
      } catch (e) {
        const thinking = document.getElementById('thinking-bubble');
        if (thinking) thinking.remove();
        msgs.innerHTML += `<div class="msg agent"><div class="avatar">${avatar}</div><div class="bubble"><div class="sender">${escapeHtml(activeAgent.name)}</div><i>Connection lost. Try again.</i></div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
      }
    }

    async function fetchWorld() { try { const d = await (await fetch('/api/world')).json(); updateGraph(d); } catch(e){} }
    let enrichedMap = {}; // conversation_id → {dialogue, response, agent_a, agent_b}
    async function loadEnriched() {
      try {
        const d = await (await fetch('/api/enrichment/enriched')).json();
        enrichedMap = {};
        for (const i of (d.interactions || [])) {
          // Index by conversation_id if available, otherwise by agent_a+agent_b+tick
          const key = i.conversation_id || (i.agent_a + '+' + i.agent_b + '+' + i.tick);
          enrichedMap[key] = {
            dialogue: i.enriched_dialogue,
            response: i.enriched_response,
            agent_a: i.agent_a,
            agent_b: i.agent_b,
            tick: i.tick,
          };
        }
      } catch(e) {}
    }

    async function fetchEvents() {
      try {
        const [liveRes, histRes] = await Promise.all([
          fetch('/api/events?limit=50').then(r=>r.json()).catch(()=>({events:[]})),
          fetch('/api/history/events?limit=100').then(r=>r.json()).catch(()=>({events:[]}))
        ]);
        await loadEnriched();
        const liveEvents = liveRes.events || [];
        const histEvents = histRes.events || [];
        const histTickSet = new Set(histEvents.map(e => e.tick + ':' + e.type + ':' + (e.content||'').slice(0,20)));
        const merged = [...histEvents, ...liveEvents.filter(e => !histTickSet.has(e.tick + ':' + e.type + ':' + (e.content||'').slice(0,20)))];
        // Merge enriched dialogue into conversation events by conversation_id
        for (const e of merged) {
          if (e.type === 'agent_conversation' || e.type === 'agent_interaction') {
            // Match by conversation_id first, then by agent pair + tick
            const convKey = e.conversation_id || (e.agent_name + '+' + (e.target_name || '') + '+' + e.tick);
            const enriched = enrichedMap[convKey];
            if (enriched) {
              e.enriched_dialogue = enriched.dialogue;
              e.enriched_response = enriched.response;
              e.dialogue = enriched.dialogue;
              e.response = enriched.response;
              if (enriched.agent_b) {
                if (!e.target_name) e.target_name = enriched.agent_b;
                if (!e.participants || e.participants.length < 2) {
                  e.participants = [{name: e.agent_name || enriched.agent_a}, {name: enriched.agent_b}];
                }
              }
            }
          }
        }
        merged.sort((a,b) => (a.tick||0) - (b.tick||0));
        updateEventFeed(merged);
        updateWorldFeed(merged);
      } catch(e) {}
    }
    async function fetchResonance() { try { const d = await (await fetch('/api/resonance')).json(); updateResonance(d.resonance); } catch(e){} }

    async function runTicks(n) {
      try { await fetch('/api/ticks/'+n, {method:'POST'}); await Promise.all([fetchWorld(), fetchEvents(), fetchResonance()]); } catch(e){}
    }

    function toggleRun() {
      running = !running; const btn = document.getElementById('run-btn');
      if (running) { btn.textContent = '⏸ Stop'; btn.classList.add('running'); runInterval = setInterval(()=>runTicks(1), 2000); }
      else { btn.textContent = '▶ Start'; btn.classList.remove('running'); clearInterval(runInterval); }
    }

    initGraph(); loadAvatarMap().then(() => { fetchWorld(); fetchEvents(); fetchResonance(); });
    // Also reload avatar map periodically
    setInterval(() => loadAvatarMap(), 30000);
  </script>
